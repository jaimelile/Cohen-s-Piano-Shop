<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10182d"><title>Cohen's Piano Shop</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#f8f4e9;background:#10182d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#243458,#10182d 68%);min-height:100vh}.wrap{max-width:620px;margin:auto;padding:22px 16px 100px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:2px;color:#8ae7d7;font-weight:900}h1{font-size:29px;line-height:1.05;margin:5px 0 0;text-shadow:3px 3px #523d80}h2{font-size:19px;margin:0 0 12px}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;font-weight:800;background:#f6bd59;color:#1b2338;box-shadow:0 4px 0 #a96a30}button:active{transform:translateY(3px);box-shadow:0 1px 0 #a96a30}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#2e3c60;color:#fff;box-shadow:0 4px 0 #1a2543}button.teal{background:#6de2ce;box-shadow:0 4px 0 #318f8b}button.red{background:#f18b9d;box-shadow:0 4px 0 #ae5369}button.small{font-size:12px;padding:9px 12px}.card{background:#1b2844;border:2px solid #405278;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 7px 0 #0b1327}.wallet{text-align:center;background:linear-gradient(130deg,#342a65,#1a4660);border-color:#8b79db}.balance{font-size:66px;font-weight:1000;line-height:1;margin:8px 0;color:#f9c767;text-shadow:4px 4px #5c3764}.muted{color:#b7c4d9;font-size:13px}.tabs{display:flex;gap:7px;margin:20px 0}.tabs button{flex:1;font-size:13px;padding:11px 4px}.tabs button.active{background:#6de2ce;box-shadow:0 4px 0 #318f8b}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.stack{display:grid;gap:12px}.reward{display:flex;align-items:center;gap:12px;border-bottom:1px solid #405278;padding:12px 0}.reward:last-child{border:0}.reward .emoji{font-size:30px;background:#2b3a5e;padding:9px;border-radius:13px}.reward .info{flex:1}.reward strong{display:block}.reward small{color:#b7c4d9}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#3c3560;color:#ffdb86;font-size:12px;font-weight:800}input,select{width:100%;padding:13px;background:#0f1a30;border:2px solid #566b94;color:white;border-radius:12px;margin:7px 0 13px}label{font-size:13px;color:#d8e5f4;font-weight:800}.notice{border-left:4px solid #6de2ce;background:#223b4c;padding:12px;border-radius:8px;margin:10px 0;font-size:13px}.history{padding:11px 0;border-bottom:1px solid #344665;font-size:13px}.history:last-child{border:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.hidden{display:none!important}.center{text-align:center}.foot{font-size:11px;color:#a9b7d2;line-height:1.5;margin-top:24px}.progress{height:10px;border-radius:20px;background:#344363;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#6de2ce}dialog{background:#1b2844;color:white;border:2px solid #8b79db;border-radius:18px;width:min(90vw,400px)}dialog::backdrop{background:#070c18d9} .badge{background:#edbd66;color:#1b2338;padding:5px 8px;border-radius:9px;font-size:11px;font-weight:900} .topbutton{font-size:12px}.note{font-size:12px;color:#f7d18b}
</style></head><body><div class="wrap"><header><div><div class="eyebrow">★ LEVEL UP YOUR MUSIC ★</div><h1>🎹 COHEN'S<br>PIANO SHOP</h1></div><button id="modeButton" class="secondary topbutton">🔒 Mom Mode</button></header><div id="wallet" class="card wallet"><div class="eyebrow">PIANO BUCKS WALLET</div><div class="balance" id="balance">0</div><div class="muted">BUCKS AVAILABLE</div></div><div id="tabs" class="tabs"><button data-tab="practice" class="active">🎵 Practice</button><button data-tab="shop" class="secondary">🛍️ Shop</button><button data-tab="history" class="secondary">🏆 History</button></div><main id="content"></main><div class="foot">Progress is saved in this browser on this device. Avoid private browsing or clearing website data. For safekeeping, Mom can export a backup. Parent PIN is a convenience lock, not bank-grade security.</div></div><dialog id="pinDialog"><h2 id="pinTitle">Mom Mode</h2><p class="muted" id="pinHelp"></p><label for="pinInput">4–8 digit PIN</label><input id="pinInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="Enter PIN"><div class="actions"><button id="pinSubmit" class="teal">Continue</button><button id="pinCancel" class="secondary">Cancel</button></div><p id="pinError" class="note"></p></dialog><input id="importFile" class="hidden" type="file" accept="application/json,.json"><script>
(()=>{'use strict';const KEY='cohen-piano-shop-v1';const baseRewards=[['🍨','Choose family dessert',3],['🌙','Stay up 30 minutes late',5],['🎬','Choose family movie',7],['🎟️','Special outing with Mom or Dad',10],['🧱','Small LEGO set or $15',16]];const initial=()=>({pin:null,balance:0,practices:[],redemptions:[],rewards:baseRewards.map((r,i)=>({id:i+1,emoji:r[0],name:r[1],cost:r[2]})),nextId:100});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(data.practices)||!Array.isArray(data.redemptions))throw Error()}catch{data=initial()}let mom=false,tab='practice';const $=id=>document.getElementById(id),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=()=>new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Could not save. Export a backup and check browser storage settings.')}}function id(){return ++data.nextId}function render(){ $('balance').textContent=data.balance;$('modeButton').textContent=mom?'🔓 Exit Mom Mode':'🔒 Mom Mode';document.querySelectorAll('[data-tab]').forEach(b=>{b.className=b.dataset.tab===tab?'active':'secondary'});if(tab==='practice')practice();if(tab==='shop')shop();if(tab==='history')history()}
function practice(){const pending=data.practices.filter(p=>p.status==='pending');let h=`<section class="card"><h2>${mom?'🛡️ Practice Approvals':'🎯 Log Your Practice'}</h2>`;if(!mom){h+=`<p class="muted">Practice goal: <strong>20 minutes</strong> · Earn <strong>1 Piano Buck</strong> after Mom approves.</p><label>How many minutes did you practice?</label><input id="minutes" type="number" min="1" max="180" value="20"><button id="submitPractice" class="teal" style="width:100%">🎵 I Practiced! Send to Mom</button><div class="notice">Your Buck is awarded only after Mom approves your practice.</div>`}else{h+=`<p class="muted">Review Cohen's sessions. Sessions of 20+ minutes earn 1 Buck; you may approve shorter sessions at your discretion.</p>`}h+='</section>';if(mom){h+=`<section class="card"><h2>⏳ Waiting for Approval <span class="badge">${pending.length}</span></h2>`;h+=pending.length?pending.map(p=>`<div class="history"><strong>${p.minutes} minutes</strong> · ${safe(p.date)} ${p.minutes<20?'<span class="note">(below goal)</span>':''}<div class="actions"><button class="teal small" data-approve="${p.id}">Approve +1 Buck</button><button class="red small" data-decline="${p.id}">Decline</button></div></div>`).join(''):'<p class="muted">All caught up! No practice requests waiting.</p>';h+=`</section><section class="card"><h2>⚙️ Parent Controls</h2><label>Change your PIN</label><input id="newPin" type="password" inputmode="numeric" maxlength="8" placeholder="New 4–8 digit PIN"><button class="secondary small" id="changePin">Change PIN</button><hr style="border:0;border-top:1px solid #405278;margin:18px 0"><div class="actions"><button class="secondary small" id="export">⬇ Export backup</button><button class="secondary small" id="import">⬆ Import backup</button></div><p class="muted">Export a backup regularly, especially before changing devices or browsers.</p></section>`}else{h+=`<section class="card"><h2>⏳ My Pending Practices</h2>${pending.length?pending.map(p=>`<div class="history">🎹 ${p.minutes} minutes · ${safe(p.date)} <span class="pill">Waiting for Mom</span></div>`).join(''):'<p class="muted">No pending practices. Ready to earn some Bucks?</p>'}</section>`} $('content').innerHTML=h;const submit=$('submitPractice');if(submit)submit.onclick=()=>{const n=Number($('minutes').value);if(!Number.isInteger(n)||n<1||n>180){alert('Enter a number from 1 to 180 minutes.');return}data.practices.unshift({id:id(),date:date(),time:Date.now(),minutes:n,status:'pending'});save();render();alert('Nice work! Your practice was sent to Mom for approval. 🎹')};document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{let p=data.practices.find(x=>x.id===Number(b.dataset.approve));if(p&&p.status==='pending'){p.status='approved';p.reviewedAt=Date.now();data.balance++;save();render()}});document.querySelectorAll('[data-decline]').forEach(b=>b.onclick=()=>{let p=data.practices.find(x=>x.id===Number(b.dataset.decline));if(p&&p.status==='pending'&&confirm('Decline this practice request?')){p.status='declined';p.reviewedAt=Date.now();save();render()}});if(mom){$('changePin').onclick=()=>{const p=$('newPin').value;if(!/^\d{4,8}$/.test(p)){alert('Use 4–8 digits.');return}data.pin=p;save();$('newPin').value='';alert('PIN updated.')};$('export').onclick=exportData;$('import').onclick=()=>$('importFile').click()}}
function shop(){let h=`<section class="card"><h2>🛍️ Rewards Shop</h2><p class="muted">Save your Bucks for something awesome! ${mom?'Approve pending reward requests below.':'Ask Mom to approve your purchase.'}</p>`;data.rewards.forEach(r=>{const pending=data.redemptions.some(x=>x.rewardId===r.id&&x.status==='pending');h+=`<div class="reward"><div class="emoji">${safe(r.emoji)}</div><div class="info"><strong>${safe(r.name)}</strong><small>${r.cost} Piano Bucks</small></div>${mom?`<button class="secondary small" data-edit="${r.id}">Edit</button>`:`<button class="small" data-buy="${r.id}" ${pending||data.balance<r.cost?'disabled':''}>${pending?'Pending':data.balance<r.cost?'Save up':'Request'}</button>`}</div>`});h+='</section>';if(mom){const pending=data.redemptions.filter(x=>x.status==='pending');h+=`<section class="card"><h2>🛡️ Purchase Approvals <span class="badge">${pending.length}</span></h2>${pending.length?pending.map(x=>`<div class="history"><strong>${safe(x.name)}</strong> · ${x.cost} Bucks<div class="actions"><button class="teal small" data-approve-buy="${x.id}" ${data.balance<x.cost?'disabled':''}>Approve & Deduct</button><button class="red small" data-decline-buy="${x.id}">Decline</button></div>${data.balance<x.cost?'<span class="note">Not enough Bucks currently available.</span>':''}</div>`).join(''):'<p class="muted">No purchases waiting.</p>'}</section><section class="card"><h2>➕ Add a Reward</h2><label>Reward name</label><input id="rewardName" maxlength="80" placeholder="Example: Trip for ice cream"><label>Cost in Bucks</label><input id="rewardCost" type="number" min="1" max="999" value="5"><button id="addReward" class="teal">Add Reward</button></section>`}else{const pending=data.redemptions.filter(x=>x.status==='pending');if(pending.length)h+=`<section class="card"><h2>⏳ Pending Purchases</h2>${pending.map(x=>`<div class="history">${safe(x.name)} · ${x.cost} Bucks <span class="pill">Waiting for Mom</span></div>`).join('')}</section>`} $('content').innerHTML=h;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const r=data.rewards.find(x=>x.id===Number(b.dataset.buy));if(!r||data.balance<r.cost)return;if(confirm(`Ask Mom to approve ${r.name} for ${r.cost} Bucks?`)){data.redemptions.unshift({id:id(),rewardId:r.id,name:r.name,cost:r.cost,date:date(),time:Date.now(),status:'pending'});save();render()}});document.querySelectorAll('[data-approve-buy]').forEach(b=>b.onclick=()=>{const x=data.redemptions.find(r=>r.id===Number(b.dataset.approveBuy));if(!x||x.status!=='pending'||data.balance<x.cost)return;if(confirm(`Approve ${x.name} and deduct ${x.cost} Bucks?`)){data.balance-=x.cost;x.status='approved';x.reviewedAt=Date.now();save();render()}});document.querySelectorAll('[data-decline-buy]').forEach(b=>b.onclick=()=>{const x=data.redemptions.find(r=>r.id===Number(b.dataset.declineBuy));if(x&&x.status==='pending'&&confirm('Decline this reward request?')){x.status='declined';x.reviewedAt=Date.now();save();render()}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=data.rewards.find(x=>x.id===Number(b.dataset.edit));if(!r)return;const name=prompt('Reward name:',r.name);if(name===null)return;const cost=prompt('Cost in Piano Bucks:',r.cost);if(cost===null)return;const n=Number(cost);if(!name.trim()||!Number.isInteger(n)||n<1||n>999){alert('Please enter a name and a whole-number cost from 1–999.');return}r.name=name.trim().slice(0,80);r.cost=n;save();render()});if(mom)$('addReward').onclick=()=>{const name=$('rewardName').value.trim(),cost=Number($('rewardCost').value);if(!name||!Number.isInteger(cost)||cost<1||cost>999){alert('Enter a reward name and a cost from 1–999.');return}data.rewards.push({id:id(),name,cost,emoji:'🎁'});save();render()}}
function history(){const approved=data.practices.filter(x=>x.status==='approved'),mins=approved.reduce((a,x)=>a+x.minutes,0);const events=[...data.practices.map(x=>({...x,kind:'practice'})),...data.redemptions.map(x=>({...x,kind:'reward'}))].sort((a,b)=>b.time-a.time);$('content').innerHTML=`<section class="card"><h2>🏆 Cohen's Progress</h2><div class="row"><div><div class="eyebrow">APPROVED SESSIONS</div><div class="balance" style="font-size:38px">${approved.length}</div></div><div><div class="eyebrow">MINUTES PRACTICED</div><div class="balance" style="font-size:38px">${mins}</div></div></div><div class="progress"><div style="width:${Math.min(100,approved.length%16/16*100)}%"></div></div><p class="muted">Every session counts toward building a great habit.</p></section><section class="card"><h2>📜 Activity History</h2>${events.length?events.slice(0,100).map(x=>`<div class="history">${x.kind==='practice'?'🎹 '+x.minutes+' minutes':'🎁 '+safe(x.name)} · ${safe(x.date)} <span class="pill">${safe(x.status)}</span></div>`).join(''):'<p class="muted">Your piano adventure starts here!</p>'}</section>`}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cohen-piano-shop-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const next=JSON.parse(await file.text());if(!Array.isArray(next.practices)||!Array.isArray(next.redemptions)||!Array.isArray(next.rewards)||!Number.isInteger(next.balance)||next.balance<0||typeof next.pin!=='string'||!/^\d{4,8}$/.test(next.pin))throw Error('Invalid backup');if(confirm('Replace all current Piano Shop data with this backup?')){data=next;save();render()}}catch{alert('This does not look like a valid Piano Shop backup.')}e.target.value=''};
$('modeButton').onclick=()=>{if(mom){mom=false;tab='practice';render();return}$('pinInput').value='';$('pinError').textContent='';$('pinTitle').textContent=data.pin?'Unlock Mom Mode':'Create Mom PIN';$('pinHelp').textContent=data.pin?'Enter your private PIN to approve requests.':'First-time setup: choose a 4–8 digit PIN. Remember it—there is no PIN recovery without a backup.';$('pinDialog').showModal();$('pinInput').focus()};$('pinCancel').onclick=()=>$('pinDialog').close();$('pinSubmit').onclick=()=>{const pin=$('pinInput').value;if(!/^\d{4,8}$/.test(pin)){$('pinError').textContent='Enter 4–8 digits.';return}if(data.pin===null){data.pin=pin;save()}else if(data.pin!==pin){$('pinError').textContent='Incorrect PIN. Try again.';return}mom=true;tab='practice';$('pinDialog').close();render()};$('pinInput').onkeydown=e=>{if(e.key==='Enter')$('pinSubmit').click()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();})();
</script></body></html>
